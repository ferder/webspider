<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Site ID:</label><div class="col-xs-12 col-sm-8"><input name="row[site_id]" class="form-control" type="number"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Task ID:</label><div class="col-xs-12 col-sm-8"><input name="row[crawl_task_id]" class="form-control" type="number"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Filter:</label><div class="col-xs-12 col-sm-8"><select name="row[filter_type]" class="form-control"><option value="all">all</option><option value="new">new</option><option value="updated">updated</option><option value="selected">selected</option></select></div></div>
  <div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary">提交</button></div></div>
</form>
