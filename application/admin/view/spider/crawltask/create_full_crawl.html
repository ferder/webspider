<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Site ID</label><div class="col-xs-12 col-sm-8"><input name="row[site_id]" class="form-control" type="number" required></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Rule ID</label><div class="col-xs-12 col-sm-8"><input name="row[rule_id]" class="form-control" type="number"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Max Products</label><div class="col-xs-12 col-sm-8"><input name="row[max_products]" class="form-control" type="number" value="100"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">Raw Products JSON</label><div class="col-xs-12 col-sm-8"><textarea name="raw_products_json" class="form-control" rows="6">[]</textarea></div></div>
  <div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary">提交</button></div></div>
</form>
