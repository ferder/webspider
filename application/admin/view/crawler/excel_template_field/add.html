<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">field_name:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[field_name]" type="text" value="{:$row.field_name|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">field_key:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[field_key]" type="text" value="{:$row.field_key|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">field_type:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[field_type]" type="text" value="{:$row.field_type|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">is_required:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[is_required]" type="text" value="{:$row.is_required|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">default_value:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[default_value]" type="text" value="{:$row.default_value|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">field_order:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[field_order]" type="text" value="{:$row.field_order|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">remark:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[remark]">{:$row.remark|default=""}</textarea></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
