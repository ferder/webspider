<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">site_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[site_id]" type="text" value="{:$row.site_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">robots_found:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[robots_found]" type="text" value="{:$row.robots_found|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">sitemap_found:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[sitemap_found]" type="text" value="{:$row.sitemap_found|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">product_sitemap_found:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[product_sitemap_found]" type="text" value="{:$row.product_sitemap_found|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">jsonld_found:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[jsonld_found]">{:$row.jsonld_found|default=""}</textarea></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">platform_guess:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[platform_guess]" type="text" value="{:$row.platform_guess|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">need_js_render:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[need_js_render]" type="text" value="{:$row.need_js_render|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">has_product_links:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[has_product_links]" type="text" value="{:$row.has_product_links|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">has_price:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[has_price]" type="text" value="{:$row.has_price|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">has_images:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[has_images]" type="text" value="{:$row.has_images|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">anti_crawl_level:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[anti_crawl_level]" type="text" value="{:$row.anti_crawl_level|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">detect_score:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[detect_score]" type="text" value="{:$row.detect_score|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">detect_status:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[detect_status]" type="text" value="{:$row.detect_status|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">detect_result_json:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[detect_result_json]">{:$row.detect_result_json|default=""}</textarea></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">error_message:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[error_message]">{:$row.error_message|default=""}</textarea></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
