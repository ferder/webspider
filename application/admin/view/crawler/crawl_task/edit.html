<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">task_no:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[task_no]" type="text" value="{:$row.task_no|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">site_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[site_id]" type="text" value="{:$row.site_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">rule_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[rule_id]" type="text" value="{:$row.rule_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">task_type:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[task_type]" type="text" value="{:$row.task_type|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">status:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[status]" type="text" value="{:$row.status|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">total_urls:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[total_urls]" type="text" value="{:$row.total_urls|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">total_products:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[total_products]" type="text" value="{:$row.total_products|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">success_count:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[success_count]" type="text" value="{:$row.success_count|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">fail_count:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[fail_count]" type="text" value="{:$row.fail_count|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">new_count:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[new_count]" type="text" value="{:$row.new_count|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">update_count:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[update_count]" type="text" value="{:$row.update_count|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">start_time:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[start_time]" type="text" value="{:$row.start_time|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">end_time:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[end_time]" type="text" value="{:$row.end_time|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">error_message:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[error_message]">{:$row.error_message|default=""}</textarea></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">task_config_json:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[task_config_json]">{:$row.task_config_json|default=""}</textarea></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
