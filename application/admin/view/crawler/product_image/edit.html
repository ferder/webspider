<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">product_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[product_id]" type="text" value="{:$row.product_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">variant_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[variant_id]" type="text" value="{:$row.variant_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">image_url:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[image_url]" type="text" value="{:$row.image_url|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">image_position:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[image_position]" type="text" value="{:$row.image_position|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">image_hash:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[image_hash]" type="text" value="{:$row.image_hash|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">is_main:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[is_main]" type="text" value="{:$row.is_main|default=""}"></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
