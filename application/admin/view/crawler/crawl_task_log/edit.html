<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">task_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[task_id]" type="text" value="{:$row.task_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">site_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[site_id]" type="text" value="{:$row.site_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">log_level:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[log_level]" type="text" value="{:$row.log_level|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">stage:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[stage]" type="text" value="{:$row.stage|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">message:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[message]">{:$row.message|default=""}</textarea></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">context_json:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[context_json]">{:$row.context_json|default=""}</textarea></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
