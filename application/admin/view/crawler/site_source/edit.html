<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">site_name:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[site_name]" type="text" value="{:$row.site_name|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">base_url:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[base_url]" type="text" value="{:$row.base_url|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">domain:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[domain]" type="text" value="{:$row.domain|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">country:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[country]" type="text" value="{:$row.country|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">language:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[language]" type="text" value="{:$row.language|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">currency:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[currency]" type="text" value="{:$row.currency|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">platform_type:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[platform_type]" type="text" value="{:$row.platform_type|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">status:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[status]" type="text" value="{:$row.status|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">detect_score:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[detect_score]" type="text" value="{:$row.detect_score|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">remark:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[remark]">{:$row.remark|default=""}</textarea></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
