<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">product_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[product_id]" type="text" value="{:$row.product_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">site_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[site_id]" type="text" value="{:$row.site_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">source_url:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[source_url]" type="text" value="{:$row.source_url|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">title:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[title]" type="text" value="{:$row.title|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">price:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[price]" type="text" value="{:$row.price|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">compare_price:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[compare_price]" type="text" value="{:$row.compare_price|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">sku:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[sku]" type="text" value="{:$row.sku|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">stock:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[stock]" type="text" value="{:$row.stock|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">image_hash:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[image_hash]" type="text" value="{:$row.image_hash|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">data_hash:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[data_hash]" type="text" value="{:$row.data_hash|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">snapshot_json:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[snapshot_json]">{:$row.snapshot_json|default=""}</textarea></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
