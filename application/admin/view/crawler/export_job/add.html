<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST">
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">job_no:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[job_no]" type="text" value="{:$row.job_no|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">site_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[site_id]" type="text" value="{:$row.site_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">task_id:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[task_id]" type="text" value="{:$row.task_id|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">export_type:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[export_type]" type="text" value="{:$row.export_type|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">status:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[status]" type="text" value="{:$row.status|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">file_path:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[file_path]" type="text" value="{:$row.file_path|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">total_products:</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[total_products]" type="text" value="{:$row.total_products|default=""}"></div></div>
<div class="form-group"><label class="control-label col-xs-12 col-sm-2">error_message:</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[error_message]">{:$row.error_message|default=""}</textarea></div></div>
<div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button><button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button></div></div></form>
